<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>Offline · IP Messenger</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #737373; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #a3a3a3; } }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 2rem; box-sizing: border-box; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif; text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.5rem; }
      button {
        font: inherit; font-weight: 500; padding: 0.5rem 1rem; border: 0; border-radius: 0.375rem;
        background: var(--fg); color: var(--bg); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>IP Messenger needs a connection. Your chats will be here when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself as soon as the connection comes back.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
