# Runs on every PR into dev/main and on every push to them.
# Make the "CI / verify" check required in the branch protection rules for dev and main.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Allows running CI by hand on any branch from the Actions tab or `gh workflow run`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The desktop app's Electron binary (MSG-34) is only needed by desktop.yml.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Build first: it generates next-env.d.ts and route types that typecheck relies on.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Typecheck
        run: npm run typecheck

      # No-op until a "test" script is added (MSG-25).
      - name: Test
        run: npm test --if-present

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -f Dockerfile.dev -t ip-messenger-dev .

      # Placeholder Supabase values: enough to build and serve pages that don't call Supabase.
      - name: Build production image
        run: >-
          docker build -t ip-messenger
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder
          .

      - name: Smoke-test production image
        run: |
          docker run -d --name web -p 3000:3000 ip-messenger
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/sign-in; then echo "ready"; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w "GET /sign-in -> %{http_code}\n" http://localhost:3000/sign-in
          docker logs web
          test "$(docker exec web whoami)" = "node"

  # MSG-26: two-user browser test against the real Supabase project. Runs only when the
  # test-user secrets are configured (see e2e/README.md); otherwise it is skipped.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check for test-user secrets
        id: secrets
        run: |
          if [ -n "$E2E_USER_A_EMAIL" ] && [ -n "$E2E_USER_B_EMAIL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::E2E secrets not configured; skipping end-to-end tests (see e2e/README.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: steps.secrets.outputs.ready == 'true'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.ready == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
