# Enforces the branch flow:
#   ticket branch (created from dev) -> PR into dev -> dev fast-forwards main.
name: Branch flow

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Only dev may be proposed into main.
  pr-into-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the head branch
        if: github.head_ref != 'dev'
        run: |
          echo "::error::PRs into main must come from dev (got '${{ github.head_ref }}'). Target dev instead."
          exit 1

  # Every ticket gets its own branch, created from the latest dev.
  pr-into-dev:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Require a ticket branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|chore|docs|ci|refactor|test)/msg-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' must be named <type>/msg-<NN>-<slug>, e.g. feat/msg-05-supabase-client."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the branch to contain the latest dev
        run: |
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::This branch is not based on the latest dev. Run: git fetch origin && git rebase origin/dev (or use 'Update branch' on the PR)."
            exit 1
          fi

  # Every commit on main must already be on dev, so main stays an ancestor of dev.
  main-is-ancestor-of-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check main is contained in dev
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::main ($GITHUB_SHA) is not an ancestor of dev. Only fast-forward main to dev: git merge --ff-only dev"
            exit 1
          fi
