services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      # Polling makes file watching reliable across bind mounts.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Keep the container's node_modules and build cache out of the host tree.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
